name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  # CI-safe defaults (real values should be set in GitHub Secrets for production deploys)
  POSTGRES_URL: ${{ secrets.POSTGRES_URL || 'postgresql://postgres:postgres@localhost:5432/payload' }}
  PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-test-secret-min-32-chars-long' }}
  BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN || 'vercel_blob_rw_ciplaceholder_0123456789ab' }}
  PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET || 'ci-preview-secret' }}
  CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-cron-secret' }}
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  NODE_OPTIONS: --no-deprecation

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runners no longer ship pnpm, and `setup-node` fails with
      # "Unable to locate executable file: pnpm" when it tries to resolve the
      # cache folder. Installing pnpm first fixes it.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: TypeScript check
        run: pnpm exec tsc --noEmit

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # The runners no longer ship pnpm, and `setup-node` fails with
      # "Unable to locate executable file: pnpm" when it tries to resolve the
      # cache folder. Installing pnpm first fixes it.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm payload migrate
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload
      - name: Generate types
        run: pnpm generate:types
      - name: Build
        run: pnpm build
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # The runners no longer ship pnpm, and `setup-node` fails with
      # "Unable to locate executable file: pnpm" when it tries to resolve the
      # cache folder. Installing pnpm first fixes it.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:int
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload
          PAYLOAD_SECRET: test-secret
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ciplaceholder_0123456789ab
          PREVIEW_SECRET: test-preview
          CRON_SECRET: test-cron
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      # The e2e tests assert on the content (a post with its JSON-LD, the
      # translated chrome): the database is empty after the migrations, so the
      # content has to be seeded before the run.
      - name: Seed content for e2e tests
        run: pnpm seed:local
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload
          PAYLOAD_SECRET: test-secret
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ciplaceholder_0123456789ab
          PREVIEW_SECRET: test-preview
          CRON_SECRET: test-cron
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload
          PAYLOAD_SECRET: test-secret
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ciplaceholder_0123456789ab
          PREVIEW_SECRET: test-preview
          CRON_SECRET: test-cron
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  # Accessibility, Lighthouse, schema and llms.txt all need a *running* server.
  # GitHub runners are ephemeral, so these checks share a single job rather than
  # `needs:`-ing a dev-server job on a different machine, where localhost:3000
  # would not exist.
  frontend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # The runners no longer ship pnpm, and `setup-node` fails with
      # "Unable to locate executable file: pnpm" when it tries to resolve the
      # cache folder. Installing pnpm first fixes it.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm payload migrate
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload
      - name: Start dev server in background
        run: |
          nohup node_modules/.bin/next dev > dev-server.log 2>&1 &
          echo $! > dev-server.pid
          for i in {1..90}; do
            if curl -sf http://localhost:3000/en > /dev/null; then
              echo "Dev server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Dev server failed to start"
          cat dev-server.log
          exit 1
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload

      - name: Dump dev server log on failure
        if: failure()
        run: cat dev-server.log

      # Article / FAQPage / BreadcrumbList live on a post, not on the home page.
      # `sdtt` fetches with Node's resolver, so use 127.0.0.1 — `localhost`
      # resolves to ::1 first and the extractor sees an empty document.
      - name: Seed content for schema validation
        run: pnpm seed:local
      - name: JSON-LD schema validation
        run: pnpm schema:validate

      - name: llms.txt reachability
        run: curl -sf http://localhost:3000/llms.txt | tee /dev/stderr | grep -q '## Main Content'

      # The a11y tools drive a real browser, so point them at the Chrome that
      # `browser-driver-manager` installs. The axe-core CLI also needs a matching
      # chromedriver — its bundled one tracks Chrome, not whatever is on PATH.
      #
      # `browser-driver-manager` only *prints* the paths it sets, it does not
      # export them to the shell: they have to be read back from its output,
      # otherwise the tools fall back to a browser that is not installed.
      - name: Install browser
        run: |
          BROWSER_OUTPUT=$(npx browser-driver-manager install chrome)
          echo "$BROWSER_OUTPUT"
          eval "$(echo "$BROWSER_OUTPUT" | grep -E '^(CHROME_TEST_PATH|CHROMEDRIVER_TEST_PATH)=' | sed 's/"//g')"
          echo "CHROME_TEST_PATH=$CHROME_TEST_PATH" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_TEST_PATH=$CHROMEDRIVER_TEST_PATH" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_TEST_PATH" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$CHROME_TEST_PATH" >> "$GITHUB_ENV"

      - name: axe-core (WCAG 2.1 A/AA)
        run: pnpm a11y:axe

      - name: pa11y multi-locale
        run: pnpm a11y:pa11y

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/fr
            http://localhost:3000/en
            http://localhost:3000/de
          configPath: ./lighthouserc.json
          uploadArtifacts: true