name: Quality Gates
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Start dev server
        run: |
          pnpm dev &
          sleep 30
      - name: axe-core (RGAA-mappable rules)
        run: npx @axe-core/cli http://localhost:3000 --tags wcag2a,wcag2aa,wcag22aa --exit
      - name: pa11y multi-locale
        run: |
          for locale in fr en de es; do
            echo "Testing locale: $locale"
            npx pa11y http://localhost:3000/$locale --standard WCAG2AA --level error
          done

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Start dev server
        run: |
          pnpm dev &
          sleep 30
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/fr
            http://localhost:3000/en
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Start dev server
        run: |
          pnpm dev &
          sleep 30
      - name: JSON-LD Schema Validation
        run: npx structured-data-testing-tool http://localhost:3000/fr --schemas Article,FAQPage,BreadcrumbList,WebPage

  llms-txt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Start dev server
        run: |
          pnpm dev &
          sleep 30
      - name: llms.txt reachability
        run: curl -sf http://localhost:3000/llms.txt > /dev/null

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: TypeScript check
        run: pnpm exec tsc --noEmit

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:int
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload
          PAYLOAD_SECRET: test-secret
          BLOB_READ_WRITE_TOKEN: test-token
          PREVIEW_SECRET: test-preview
          CRON_SECRET: test-cron
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/payload
          PAYLOAD_SECRET: test-secret
          BLOB_READ_WRITE_TOKEN: test-token
          PREVIEW_SECRET: test-preview
          CRON_SECRET: test-cron
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000